name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    # mlx-swift and its dependencies (swift-collections 1.7.x) need Swift tools 6.4 (Xcode 26.x).
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Select the newest Xcode
      # Plain shell, not a third-party action: the repo only allows GitHub-owned and verified actions.
      run: |
        X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
        sudo xcode-select -s "$X"
        xcodebuild -version
        swift --version

    - name: Install Metal Toolchain
      # The MLX dependency compiles Metal shaders; Xcode 16 no longer bundles the
      # Metal Toolchain by default, so the build fails without this.
      run: xcodebuild -downloadComponent MetalToolchain || true

    - name: Build & Test
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
        if [ -z "$XCODEPROJ" ]; then echo "No Xcode project found"; exit 1; fi
        SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
        echo "Testing scheme: $SCHEME"
        set -o pipefail
        xcodebuild test \
          -project "$XCODEPROJ" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          -only-testing:"MBox ExplorerTests/MailboxCacheTests" \
          -only-testing:"MBox ExplorerTests/MboxParserStreamingTests" \
          -only-testing:"MBox ExplorerTests/FilePermissionsTests" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -60
